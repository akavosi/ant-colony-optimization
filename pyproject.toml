[project]
name = "ant-colony-optimization"
version = "0.1.0"
description = "Watching a colony of ants learn a route, rendered as publication-quality 2D/3D animation."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]
